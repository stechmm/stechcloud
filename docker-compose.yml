version: '3.8'

services:
  personal-cloud:
    build: .
    container_name: personal-cloud-app
    restart: always
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      - PORT=${PORT:-8090}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-key-for-security-2026}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
