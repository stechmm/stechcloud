<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Shared File - Personal Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      padding: 1.5rem;
    }
    .share-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .file-icon-box {
      width: 72px;
      height: 72px;
      background-color: var(--bg-surface-elevated);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>

  <div class="share-card" id="share-box">
    <div class="file-icon-box">
      <i class="fa-solid fa-cloud-arrow-down"></i>
    </div>
    <div id="file-info-area">
      <h3 id="file-name" style="word-break: break-all;">Loading shared file...</h3>
      <p id="file-meta" class="text-muted" style="font-size:0.9rem; margin-top:0.25rem;">Checking availability</p>
    </div>

    <div id="password-section" style="display: none; width: 100%; text-align: left;">
      <label for="share-pwd-input" style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">Password Required</label>
      <input type="password" id="share-pwd-input" class="form-control" style="margin-top:0.35rem;" placeholder="Enter password to unlock" />
    </div>

    <button id="download-btn" class="btn-primary" style="width: 100%; padding:0.75rem; justify-content: center; font-size:1rem;">
      <i class="fa-solid fa-download"></i> Download File
    </button>
    <p id="status-msg" style="font-size:0.85rem; color:var(--accent-danger); display:none;"></p>
  </div>

  <script src="/js/ui.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');

    if (!token) {
      document.getElementById('file-name').textContent = 'Invalid Share Link';
      document.getElementById('file-meta').textContent = 'No share token provided.';
      document.getElementById('download-btn').style.display = 'none';
    } else {
      fetch(`/api/public/share/${token}`)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById('file-name').textContent = 'Link Expired or Not Found';
            document.getElementById('file-meta').textContent = data.message || 'This file is no longer available.';
            document.getElementById('download-btn').style.display = 'none';
            return;
          }

          const share = data.share;
          document.getElementById('file-name').textContent = share.name;
          document.getElementById('file-meta').textContent = `${share.isDirectory ? 'Folder (ZIP)' : UI.formatBytes(share.size)} • Shared on ${new Date(share.createdAt).toLocaleDateString()}`;

          if (share.hasPassword) {
            document.getElementById('password-section').style.display = 'block';
          }

          document.getElementById('download-btn').onclick = async () => {
            const password = document.getElementById('share-pwd-input').value;
            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.display = 'none';

            try {
              const res = await fetch(`/api/public/share/${token}/download`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
              });

              if (!res.ok) {
                const text = await res.text();
                statusMsg.textContent = text || 'Download failed';
                statusMsg.style.display = 'block';
                return;
              }

              const blob = await res.blob();
              const downloadUrl = window.URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = downloadUrl;
              a.download = share.isDirectory ? `${share.name}.zip` : share.name;
              document.body.appendChild(a);
              a.click();
              a.remove();
            } catch (err) {
              statusMsg.textContent = err.message;
              statusMsg.style.display = 'block';
            }
          };
        })
        .catch(err => {
          document.getElementById('file-name').textContent = 'Error Loading Share';
          document.getElementById('file-meta').textContent = err.message;
          document.getElementById('download-btn').style.display = 'none';
        });
    }
  </script>
</body>
</html>
