<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S-Tech Cloud</title>
  <meta name="description" content="Secure, high-performance personal cloud storage system for files, photos, videos and documents.">
  <meta name="theme-color" content="#0f172a">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>">
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Fullscreen Dropzone Overlay -->
  <div id="dropzone-overlay" class="dropzone-overlay">
    <i class="fa-solid fa-cloud-arrow-up fa-4x text-primary"></i>
    <h2>Drop files here to upload</h2>
    <p class="text-muted">Files will be saved into the current folder</p>
  </div>

  <div id="app">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-cloud"></i>
        </div>
        <div class="brand-title">S-Tech Cloud</div>
      </div>

      <div class="nav-group">
        <span class="nav-label">Explorer</span>
        <button class="nav-item active" data-filter="all">
          <i class="fa-solid fa-hard-drive"></i>
          <span>All Files</span>
        </button>
        <button class="nav-item" data-filter="recent">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>Recent</span>
        </button>
        <button class="nav-item" data-filter="starred">
          <i class="fa-solid fa-star text-warning"></i>
          <span>Starred</span>
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-label">Media & Docs</span>
        <button class="nav-item" data-filter="photos">
          <i class="fa-solid fa-image text-info"></i>
          <span>Photos</span>
        </button>
        <button class="nav-item" data-filter="videos">
          <i class="fa-solid fa-film text-danger"></i>
          <span>Videos</span>
        </button>
        <button class="nav-item" data-filter="audio">
          <i class="fa-solid fa-music text-purple" style="color: #a855f7;"></i>
          <span>Music</span>
        </button>
        <button class="nav-item" data-filter="docs">
          <i class="fa-solid fa-file-lines text-primary"></i>
          <span>Documents</span>
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-label">System</span>
        <button class="nav-item" data-filter="trash">
          <i class="fa-solid fa-trash-can"></i>
          <span>Recycle Bin</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="storage-card">
          <div class="storage-header">
            <span>Storage</span>
            <span id="storage-text">0 B Used</span>
          </div>
          <div class="storage-bar-bg">
            <div class="storage-bar-fill" id="storage-fill" style="width: 5%;"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Viewport -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass text-muted"></i>
          <input type="text" id="search-input" placeholder="Search files, photos, videos..." autocomplete="off" />
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-sun"></i>
          </button>
          <button class="icon-btn" id="view-toggle-btn" title="Switch View Mode">
            <i class="fa-solid fa-list"></i>
          </button>
          <button class="icon-btn" id="logout-btn" title="Log Out">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-body">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="breadcrumbs" id="breadcrumbs">
            <!-- Dynamically Rendered -->
          </div>

          <div class="action-buttons">
            <input type="file" id="file-upload-input" multiple style="display: none;" />
            <input type="file" id="folder-upload-input" webkitdirectory directory multiple style="display: none;" />
            
            <button class="btn-secondary" id="new-folder-btn">
              <i class="fa-solid fa-folder-plus"></i> New Folder
            </button>
            <button class="btn-primary" id="upload-file-btn">
              <i class="fa-solid fa-upload"></i> Upload
            </button>
          </div>
        </div>

        <!-- File List / Grid Container -->
        <div id="file-container">
          <!-- Dynamically Rendered -->
        </div>
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-filter="all">
      <i class="fa-solid fa-hard-drive"></i>
      <span>Files</span>
    </button>
    <button class="bottom-nav-item" data-filter="photos">
      <i class="fa-solid fa-image"></i>
      <span>Photos</span>
    </button>
    <button class="bottom-nav-item" data-filter="starred">
      <i class="fa-solid fa-star"></i>
      <span>Starred</span>
    </button>
    <button class="bottom-nav-item" data-filter="trash">
      <i class="fa-solid fa-trash"></i>
      <span>Trash</span>
    </button>
  </nav>

  <!-- Mobile Floating Action Button -->
  <button class="mobile-fab" onclick="document.getElementById('file-upload-input').click()" title="Upload File">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Batch Selection Floating Bar -->
  <div id="selection-bar" class="selection-bar">
    <span id="selection-count" style="font-weight: 600;">1 selected</span>
    <div id="selection-normal-actions" style="display: flex; gap: 0.5rem;">
      <button class="btn-secondary btn-sm" id="batch-download-btn"><i class="fa-solid fa-download"></i> ZIP</button>
      <button class="btn-danger btn-sm" id="batch-delete-btn"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
    <div id="selection-trash-actions" style="display: none; gap: 0.5rem;">
      <button class="btn-secondary btn-sm" id="batch-restore-btn"><i class="fa-solid fa-rotate-left"></i> Restore</button>
      <button class="btn-danger btn-sm" id="batch-purge-btn"><i class="fa-solid fa-trash-can"></i> Delete Forever</button>
    </div>
  </div>

  <!-- Active Uploads Floating Drawer -->
  <div id="upload-drawer" class="upload-drawer">
    <div class="upload-drawer-header">
      <span id="upload-drawer-title">Uploading...</span>
      <button class="icon-btn btn-sm" style="width:24px; height:24px; border:none;" onclick="this.closest('.upload-drawer').classList.remove('show')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="upload-list" id="upload-list"></div>
  </div>

  <!-- Modal: Login -->
  <div class="modal-backdrop" id="login-modal">
    <div class="modal-card" style="max-width: 380px;">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <i class="fa-solid fa-cloud text-primary fa-lg"></i>
          <h3 style="margin:0;">S-Tech Cloud</h3>
        </div>
      </div>
      <form id="login-form">
        <div class="modal-body">
          <p class="text-muted" style="font-size:0.9rem;">Enter your master password to access your cloud files.</p>
          <div class="form-group">
            <label for="login-password">Master Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autofocus />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-primary" style="width: 100%;">
            <i class="fa-solid fa-lock-open"></i> Unlock Cloud
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: New Folder -->
  <div class="modal-backdrop" id="new-folder-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create New Folder</h3>
        <button class="icon-btn" onclick="document.getElementById('new-folder-modal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="new-folder-input">Folder Name</label>
          <input type="text" id="new-folder-input" class="form-control" placeholder="e.g. Vacation Photos, Projects" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="document.getElementById('new-folder-modal').classList.remove('show')">Cancel</button>
        <button class="btn-primary" id="create-folder-btn">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Rename -->
  <div class="modal-backdrop" id="rename-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Rename Item</h3>
        <button class="icon-btn" onclick="document.getElementById('rename-modal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="rename-input">New Name</label>
          <input type="text" id="rename-input" class="form-control" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="document.getElementById('rename-modal').classList.remove('show')">Cancel</button>
        <button class="btn-primary" id="save-rename-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Modal: Share Link -->
  <div class="modal-backdrop" id="share-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Share Link</h3>
        <button class="icon-btn" onclick="document.getElementById('share-modal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p style="font-weight: 500;" id="share-file-name">filename.ext</p>
        <div class="form-group">
          <label for="share-password">Password Protect (Optional)</label>
          <input type="password" id="share-password" class="form-control" placeholder="Leave empty for public link" />
        </div>
        <div class="form-group">
          <label for="share-expiry">Expiration (Days)</label>
          <select id="share-expiry" class="form-control">
            <option value="0">Never Expires</option>
            <option value="1">1 Day</option>
            <option value="7" selected>7 Days</option>
            <option value="30">30 Days</option>
          </select>
        </div>
        <button class="btn-primary" id="generate-share-btn" style="width: 100%;">Generate Share Link</button>

        <div id="share-result" style="display: none; margin-top: 1rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">Shareable Link</label>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
            <input type="text" id="share-url-input" class="form-control" readonly style="flex:1;" />
            <button class="btn-secondary" id="copy-share-btn"><i class="fa-solid fa-copy"></i> Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Media Preview Modal -->
  <div id="preview-modal" class="preview-modal">
    <div class="preview-header">
      <div style="display: flex; align-items: center; gap: 0.75rem; overflow: hidden;">
        <span id="preview-title" style="font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Preview</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button class="icon-btn" id="preview-download-btn" title="Download"><i class="fa-solid fa-download"></i></button>
        <button class="icon-btn" onclick="document.getElementById('preview-modal').classList.remove('show')" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="preview-content" id="preview-content">
      <!-- Media will be injected here -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
